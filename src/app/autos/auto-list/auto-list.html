<div class="acciones">
  <a routerLink="/autos/nuevo">Nuevo auto</a>
  <a routerLink="/competiciones">Ver competiciones</a>
</div>

<p *ngIf="cargando">Cargando...</p>

<p class="error" *ngIf="error">{{ error }}</p>

<p *ngIf="!cargando && !error && autos.length === 0">No hay autos todavía. Creá el primero.</p>

<table *ngIf="!cargando && autos.length > 0">
  <thead>
    <tr>
      <th>Modelo</th>
      <th>Marca</th>
      <th>Número</th>
      <th>Potencia</th>
      <th>Piloto</th>
      <th>Categoría</th>
      <th>Competición</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let a of autos">
      <td>{{ a.modelo }}</td>
      <td>{{ a.marca }}</td>
      <td>{{ a.numero }}</td>
      <td>{{ a.potencia }}</td>
      <td>{{ a.piloto }}</td>
      <td>{{ a.categoria }}</td>
      <td>{{ a.competicion?.nombre ?? '—' }}</td>
      <td class="acciones">
        <a [routerLink]="['/autos/editar', a.id]">Editar</a>
        <button (click)="borrar(a.id)">Borrar</button>
      </td>
    </tr>
  </tbody>
</table>
