<h2>{{ esEdicion ? 'Editar competición' : 'Nueva competición' }}</h2>

<p class="error" *ngIf="error">{{ error }}</p>

<form #compForm="ngForm" (ngSubmit)="guardar()">
  <div>
    <label for="nombre">Nombre:</label>
    <input
      id="nombre"
      name="nombre"
      type="text"
      required
      [(ngModel)]="competicion.nombre"
      #nombre="ngModel"
    />
    <span class="error" *ngIf="nombre.invalid && nombre.touched">El nombre es obligatorio.</span>
  </div>

  <div>
    <label for="premio">Premio:</label>
    <input
      id="premio"
      name="premio"
      type="text"
      required
      [(ngModel)]="competicion.premio"
      #premio="ngModel"
    />
    <span class="error" *ngIf="premio.invalid && premio.touched">El premio es obligatorio.</span>
  </div>

  <div>
    <label for="fecha">Fecha:</label>
    <input
      id="fecha"
      name="fecha"
      type="date"
      required
      [(ngModel)]="competicion.fecha"
      #fecha="ngModel"
    />
    <span class="error" *ngIf="fecha.invalid && fecha.touched">La fecha es obligatoria.</span>
  </div>

  <div>
    <label for="lugar">Lugar:</label>
    <input
      id="lugar"
      name="lugar"
      type="text"
      required
      [(ngModel)]="competicion.lugar"
      #lugar="ngModel"
    />
    <span class="error" *ngIf="lugar.invalid && lugar.touched">El lugar es obligatorio.</span>
  </div>

  <div class="acciones">
    <button type="submit" class="btn" [disabled]="compForm.invalid || guardando">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
    <a class="btn btn-secundario" routerLink="/competiciones">Cancelar</a>
  </div>
</form>
