<div class="acciones">
  <a routerLink="/competiciones/nueva">Nueva competición</a>
  <a routerLink="/autos">Ver autos</a>
</div>

<p *ngIf="cargando">Cargando...</p>

<p class="error" *ngIf="error">{{ error }}</p>

<p *ngIf="!cargando && !error && competiciones.length === 0">
  No hay competiciones todavía. Creá la primera.
</p>

<table *ngIf="!cargando && competiciones.length > 0">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Premio</th>
      <th>Fecha</th>
      <th>Lugar</th>
      <th>Autos</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of competiciones">
      <td>{{ c.nombre }}</td>
      <td>{{ c.premio }}</td>
      <td>{{ c.fecha }}</td>
      <td>{{ c.lugar }}</td>
      <td>{{ c.autos?.length ?? 0 }}</td>
      <td class="acciones">
        <a [routerLink]="['/competiciones/editar', c.id]">Editar</a>
        <button (click)="borrar(c.id)">Borrar</button>
      </td>
    </tr>
  </tbody>
</table>
